[project]
name = "emma-composition-mass-estimator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.19"
dependencies = [
    "albumentations==1.1.0",
    "emma-wrapper>=0.1.14",
    "h5py==3.6.0",
    "hdf5plugin>=6.0.0",
    "matplotlib>=3.7",
    "matplotlib-inline>=0.2.2",
    "opencv-python==4.5.5.64",
    "pandas>=1.5.1",
    "pyvista==0.35.2",
    "scipy==1.7.3",
    "setuptools>=82.0.1",
    "tensorboardx==2.4.1",
    "timm==0.5.4",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
]

[tool.uv]
build-constraint-dependencies = ["setuptools<82"]

[tool.uv.sources]
emma-wrapper = { git = "https://github.com/AltFLanca/EMMa-Wrapper.git", rev = "c1d9a8cd6b09edb97325e8dd845c5100d7ffacca" }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipympl>=0.10.0",
]
